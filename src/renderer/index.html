<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: file:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.openai.com;">
  <title>App Creator A to Z</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/output.css">
</head>
<body class="min-h-screen bg-surface-950 text-surface-100 overflow-hidden">
  <!-- Main Application Container -->
  <div id="app" class="flex flex-col h-screen">
    <!-- Window Drag Region (Title Bar) -->
    <div class="window-drag-region h-8 bg-surface-900 flex items-center justify-center shrink-0">
      <div class="flex items-center gap-2">
        <img src="../assets/icon.png" alt="" class="w-4 h-4 rounded pointer-events-none">
        <span class="text-xs text-surface-500 font-medium pointer-events-none">App Creator A to Z</span>
      </div>
    </div>
    
    <!-- App Content -->
    <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="w-64 bg-surface-900 border-r border-surface-800 flex flex-col">
      <!-- Logo -->
      <div class="p-6 border-b border-surface-800 flex justify-center">
        <img src="../assets/icon.png" alt="App Creator A to Z" class="w-36 h-36 rounded-xl shadow-lg">
      </div>

      <!-- Navigation Links -->
      <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
        <a href="#" class="nav-link-active" data-page="dashboard" onclick="navigateTo('dashboard')">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-link" data-page="new-project" onclick="navigateTo('new-project')">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
          </svg>
          <span>New Project</span>
        </a>
        <div class="pt-4 pb-2">
          <p class="px-4 text-xs font-semibold text-surface-500 uppercase tracking-wider">Active Projects</p>
        </div>
        <div id="project-list" class="space-y-1">
          <!-- Projects will be loaded here -->
        </div>
      </nav>

      <!-- Bottom Section -->
      <div class="p-4 border-t border-surface-800 space-y-2">
        <a href="#" class="nav-link" data-page="settings" onclick="navigateTo('settings')">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>Settings</span>
        </a>
        <div class="flex items-center gap-2 px-4 py-2 text-xs text-surface-500">
          <div id="api-status" class="w-2 h-2 rounded-full bg-red-500"></div>
          <span id="api-status-text">API Not Configured</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- Top Bar -->
      <header class="h-16 bg-surface-900/50 border-b border-surface-800 flex items-center justify-between px-6">
        <div class="flex items-center gap-4">
          <h2 id="page-title" class="text-xl font-semibold">Dashboard</h2>
        </div>
        <div class="flex items-center gap-4">
          <!-- App Version -->
          <span id="app-version" class="text-sm text-surface-400">v1.0.0</span>
        </div>
      </header>

      <!-- Content Container -->
      <div id="content" class="flex-1 overflow-y-auto p-6">
        <!-- Content will be loaded here based on navigation -->
      </div>
    </main>
  </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" class="hidden"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 space-y-2 z-50"></div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-surface-950/80 backdrop-blur-sm z-50 hidden items-center justify-center">
    <div class="text-center max-w-4xl w-full mx-auto px-6">
      <div class="w-16 h-16 border-4 border-primary-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p id="loading-text" class="text-surface-300 mb-2">Loading...</p>
      <p id="loading-joke" class="text-surface-500 text-sm italic"></p>
      <div id="loading-stream" class="mt-6 text-left bg-surface-800/80 rounded-lg p-6 max-h-96 overflow-y-auto hidden border border-surface-700">
        <p id="loading-stream-text" class="text-surface-300 text-sm whitespace-pre-wrap font-mono leading-relaxed"></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
